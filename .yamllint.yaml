---
# yamllint over the repository's YAML (workflows, configs), as in nix-orca.
extends: default
rules:
  # `on:` is a GitHub Actions key, not a boolean.
  truthy:
    check-keys: false
  # SHA-pinned action references with their version comment exceed 80.
  line-length:
    max: 120
# Written by the pinned pnpm (checks T1), never by hand; its integrity
# lines run past any cap.
ignore: |
  checks/fixture/pnpm-lock.yaml
