# Hand-written, listed in .actlith: no actlith kind asserts these.
# - pins: the flake's nixpkgs is exactly the rev nixpkgs-lock publishes
#   (root V1); a drift shows up only as a silent cache miss otherwise.
# - rebuild: the fixture's fixed-output deps fetch, built a second time
#   with --rebuild, gives the same output (checks V1, checks T2).
---
name: assert

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: assert-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
      - run: bash gate/pin-rev.sh flake.lock
        shell: bash
  rebuild:
    name: rebuild
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - run: bash checks/rebuild.sh
        shell: bash
